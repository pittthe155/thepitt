// ---------- estado do app ----------
const S = {

// ---------- erros em português ----------
function traduz(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  const t = [
    [/Invalid login credentials/i, 'E-mail ou senha incorretos.'],
    [/Email not confirmed/i, 'Conta ainda não confirmada. A coordenação precisa marcar "Auto Confirm User" ao criar o usuário.'],
    [/should be at least/i, 'A senha precisa ter pelo menos 6 caracteres.'],
    [/should be different/i, 'A nova senha precisa ser diferente da atual.'],
    [/Failed to fetch|NetworkError|Load failed/i, 'Sem conexão com o servidor. Verifique a internet.'],
    [/perfis_nome_escala_unico/i, 'Já existe um médico com esse nome na escala.'],
    [/duplicate key/i, 'Esse registro já existe.'],
    [/row-level security|permission denied/i, 'Você não tem permissão para esta ação.'],
    [/does not exist|Could not find the (table|function)|schema cache/i, 'O banco ainda não foi instalado ou está desatualizado. Rode o script SQL no Supabase.'],
    [/JWT|token/i, 'Sua sessão expirou. Entre novamente.'],
  ].find(([r]) => r.test(m));
  return new Error(t ? t[1] : m);
}

// =====================================================================
//  CAMADA DE DADOS 1: SUPABASE (dados reais, compartilhados em tempo real)
// =====================================================================
let sb = null, api = null;
async function q(pr) { const { data, error } = await pr; if (error) throw traduz(error); return data; }
async function todos(montar) {
  let out = [], i = 0;
  for (;;) { const d = await q(montar().range(i, i + 999)); out = out.concat(d || []); if (!d || d.length < 1000) return out; i += 1000; }
}
const SupaAPI = {
  async sessao() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
  async login(email, senha) { const { data, error } = await sb.auth.signInWithPassword({ email, password: senha }); if (error) throw traduz(error); return data.user; },
  async sair() { try { sb.removeAllChannels(); } catch (e) {} await sb.auth.signOut(); },
  async trocarSenha(s) { const { error } = await sb.auth.updateUser({ password: s }); if (error) throw traduz(error); },
  async perfilDe(id) { return q(sb.from('perfis').select('*').eq('id', id).maybeSingle()); },
  async carregar(de, ate) {
    const desde = addDias(new Date(), -60).toISOString();
    const [hospital, setores, perfis, plantoes, ativas, recentes] = await Promise.all([
      q(sb.from('hospitais').select('*').limit(1).maybeSingle()),
      q(sb.from('setores').select('*').order('nome')),
      todos(() => sb.from('perfis').select('*').order('nome')),
      todos(() => sb.from('plantoes').select('*').gte('inicio', de.toISOString()).lt('inicio', ate.toISOString()).order('inicio')),
      todos(() => sb.from('solicitacoes').select('*').in('status', ATIVOS)),
      todos(() => sb.from('solicitacoes').select('*').gte('criado_em', desde).order('criado_em', { ascending: false })),
    ]);
    const mapa = new Map(); [...ativas, ...recentes].forEach(s => mapa.set(s.id, s));
    const sols = [...mapa.values()].sort((a, b) => D(b.criado_em) - D(a.criado_em));
    const tem = new Set(plantoes.map(p => p.id));
    const faltam = [...new Set(sols.flatMap(s => [s.plantao_id, s.plantao_contra_id]).filter(id => id && !tem.has(id)))];
    for (let i = 0; i < faltam.length; i += 100) plantoes.push(...await q(sb.from('plantoes').select('*').in('id', faltam.slice(i, i + 100))));
    const anuncios = sols.filter(s => s.tipo === 'anuncio').map(s => s.id);
    let cands = [];
    for (let i = 0; i < anuncios.length; i += 100) cands = cands.concat(await q(sb.from('candidaturas').select('*').in('solicitacao_id', anuncios.slice(i, i + 100))));
    return { hospital, setores, perfis, plantoes, sols, cands };
  },
  async plantoesPeriodo(de, ate) { return todos(() => sb.from('plantoes').select('*').gte('inicio', de.toISOString()).lt('inicio', ate.toISOString()).order('inicio')); },
  async historico(de, ate) { return todos(() => sb.from('historico').select('*').gte('inicio', de.toISOString()).lt('inicio', ate.toISOString()).order('inicio')); },
  async rpc(nome, args) { return q(sb.rpc(nome, args)); },
  async salvar(t, row) {
    if (row.id) { const { id, ...resto } = row; return q(sb.from(t).update(resto).eq('id', id).select().single()); }
    return q(sb.from(t).insert(row).select().single());
  },
  async excluir(t, id) { return q(sb.from(t).delete().eq('id', id)); },
  async inserirVarios(t, rows) { for (let i = 0; i < rows.length; i += 500) await q(sb.from(t).insert(rows.slice(i, i + 500))); },
  ouvir(cb) {
    const ch = sb.channel('escala');
    ['plantoes', 'solicitacoes', 'candidaturas', 'perfis', 'setores'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, cb));
    ch.subscribe();
  },
};

const ERR = m => { throw new Error(m); };
const dP = id => DB.plantoes.find(x => x.id === id);
const dApto = (m, s) => { const p = DB.perfis.find(x => x.id === m); return !!p && p.ativo && p.setores.includes(s); };
const dConf = (m, i, f, ign = []) => DB.plantoes.some(x => x.medico_id === m && !ign.includes(x.id) && D(x.inicio) < D(f) && D(x.fim) > D(i));
const dExige = pid => !!DB.setores.find(s => s.id === dP(pid)?.setor_id)?.exige_aprovacao;
const novaSol = o => ({ id: uid(), hospital_id: DB.hospitais[0].id, plantao_contra_id: null, destinatario_id: null, status: 'pendente', mensagem: null, motivo: null, decidido_por: null, aceito_em: null, concluido_em: null, criado_em: agoraISO(), ...o });

function dExec(s, por) {
  const pl = dP(s.plantao_id);
  if (D(pl.inicio) <= new Date()) ERR('O plantão já começou; este pedido não vale mais.');
  if (!(s.tipo === 'anuncio' && !pl.medico_id) && pl.medico_id !== s.solicitante_id) ERR('O plantão mudou de dono desde o pedido.');
  if (!s.destinatario_id) ERR('Falta definir quem assume o plantão.');
  const hist = (p, de, para) => DB.historico.push({ id: uid(), hospital_id: s.hospital_id, tipo: s.tipo, plantao_id: p.id, solicitacao_id: s.id, de_medico_id: de, para_medico_id: para, setor_id: p.setor_id, inicio: p.inicio, fim: p.fim, detalhes: null, feito_por: por, criado_em: agoraISO() });
  let pc = null;
  if (s.tipo === 'troca') {
    pc = dP(s.plantao_contra_id);
    if (!pc || pc.medico_id !== s.destinatario_id || D(pc.inicio) <= new Date()) ERR('O plantão do colega mudou desde o pedido.');
    if (dConf(s.destinatario_id, pl.inicio, pl.fim, [pc.id]) || dConf(s.solicitante_id, pc.inicio, pc.fim, [pl.id])) ERR('Conflito de horário: alguém já tem plantão nesse período.');
    hist(pl, s.solicitante_id, s.destinatario_id); hist(pc, s.destinatario_id, s.solicitante_id);
    pl.medico_id = s.destinatario_id; pc.medico_id = s.solicitante_id; pl.status = pc.status = 'designado';
  } else {
    if (dConf(s.destinatario_id, pl.inicio, pl.fim)) ERR('Quem vai assumir já tem plantão nesse horário.');
    hist(pl, pl.medico_id, s.destinatario_id); pl.medico_id = s.destinatario_id; pl.status = 'designado';
  }
  s.status = 'concluida'; s.concluido_em = agoraISO(); s.decidido_por = s.decidido_por || por;
  const ids = [pl.id, pc && pc.id].filter(Boolean);
  DB.solicitacoes.forEach(o => { if (o.id !== s.id && ativa(o) && ids.some(x => o.plantao_id === x || o.plantao_contra_id === x)) { o.status = 'cancelada'; o.motivo = 'O plantão foi movimentado por outro pedido.'; } });
}
const voltaStatus = p => { if (p && p.status === 'anunciado') p.status = p.medico_id ? 'designado' : 'vago'; };

const DemoRPC = {
  criar_solicitacao(eu, a) {
    if (!['troca', 'passagem', 'anuncio'].includes(a.p_tipo)) ERR('Tipo de pedido inválido.');
    const pl = dP(a.p_plantao); if (!pl) ERR('Plantão não encontrado.');
    if (D(pl.inicio) <= new Date()) ERR('Esse plantão já começou.');
    if (!pl.medico_id) { if (!(a.p_tipo === 'anuncio' && eu.papel === 'coordenador')) ERR('Plantão vago: só a coordenação pode anunciar.'); }
    else if (pl.medico_id !== eu.id) ERR('Este plantão não é seu.');
    let pc = null;
    if (a.p_tipo !== 'anuncio') {
      if (!a.p_destinatario || a.p_destinatario === eu.id) ERR('Escolha um colega.');
      if (!dApto(a.p_destinatario, pl.setor_id)) ERR('O colega não está habilitado neste setor.');
    }
    if (a.p_tipo === 'troca') {
      pc = dP(a.p_plantao_contra);
      if (!pc || pc.medico_id !== a.p_destinatario) ERR('Escolha um plantão do colega para trocar.');
      if (D(pc.inicio) <= new Date()) ERR('O plantão do colega já começou.');
      if (!dApto(eu.id, pc.setor_id)) ERR('Você não está habilitado no setor do plantão do colega.');
      if (dConf(a.p_destinatario, pl.inicio, pl.fim, [pc.id])) ERR('O colega já tem plantão no seu horário.');
      if (dConf(eu.id, pc.inicio, pc.fim, [pl.id])) ERR('Você já tem plantão no horário do colega.');
    } else if (a.p_tipo === 'passagem' && dConf(a.p_destinatario, pl.inicio, pl.fim)) ERR('O colega já tem plantão nesse horário.');
    if (DB.solicitacoes.some(s => ativa(s) && (s.plantao_id === pl.id || (pc && s.plantao_contra_id === pc.id)))) ERR('Já existe um pedido em andamento para este plantão.');
    const s = novaSol({ tipo: a.p_tipo, plantao_id: pl.id, plantao_contra_id: pc ? pc.id : null, solicitante_id: eu.id, destinatario_id: a.p_tipo === 'anuncio' ? null : a.p_destinatario, mensagem: (a.p_mensagem || '').trim() || null });
    DB.solicitacoes.push(s); if (a.p_tipo === 'anuncio') pl.status = 'anunciado';
    return s.id;
  },
  responder_solicitacao(eu, a) {
    const s = DB.solicitacoes.find(x => x.id === a.p_solicitacao);
    if (!s || s.tipo === 'anuncio' || s.destinatario_id !== eu.id) ERR('Pedido não encontrado.');
    if (s.status !== 'pendente') ERR('Este pedido já foi respondido.');
    if (!a.p_aceitar) { Object.assign(s, { status: 'recusada', motivo: (a.p_motivo || '').trim() || null, decidido_por: eu.id }); return 'recusada'; }
    if (dExige(s.plantao_id) || (s.plantao_contra_id && dExige(s.plantao_contra_id))) { s.aceito_em = agoraISO(); s.status = 'aguardando_coordenador'; return 'aguardando_coordenador'; }
    dExec(s, eu.id); s.aceito_em = agoraISO(); return 'concluida';
  },
  aprovar_solicitacao(eu, a) {
    if (eu.papel !== 'coordenador') ERR('Só a coordenação aprova pedidos.');
    const s = DB.solicitacoes.find(x => x.id === a.p_solicitacao);
    if (!s || s.status !== 'aguardando_coordenador') ERR('Não há nada para aprovar neste pedido.');
    if (!a.p_aprovar) { Object.assign(s, { status: 'recusada', decidido_por: eu.id, motivo: (a.p_motivo || '').trim() || 'Recusado pela coordenação.' }); voltaStatus(dP(s.plantao_id)); return 'recusada'; }
    s.decidido_por = eu.id; dExec(s, eu.id); return 'concluida';
  },
  candidatar(eu, a) {
    const s = DB.solicitacoes.find(x => x.id === a.p_solicitacao);
    if (!s || s.tipo !== 'anuncio' || s.status !== 'pendente') ERR('Este anúncio não está mais disponível.');
    const minha = DB.candidaturas.find(c => c.solicitacao_id === s.id && c.medico_id === eu.id);
    if (a.p_entrar === false) { if (minha && minha.status === 'ativa') minha.status = 'cancelada'; return; }
    if (s.solicitante_id === eu.id) ERR('O anúncio é seu.');
    const pl = dP(s.plantao_id);
    if (pl.medico_id === eu.id) ERR('O plantão já é seu.');
    if (!dApto(eu.id, pl.setor_id)) ERR('Você não está habilitado neste setor.');
    if (dConf(eu.id, pl.inicio, pl.fim)) ERR('Você já tem plantão nesse horário.');
    if (minha) Object.assign(minha, { status: 'ativa', criado_em: agoraISO() });
    else DB.candidaturas.push({ id: uid(), hospital_id: s.hospital_id, solicitacao_id: s.id, medico_id: eu.id, status: 'ativa', criado_em: agoraISO() });
  },
  escolher_candidato(eu, a) {
    const s = DB.solicitacoes.find(x => x.id === a.p_solicitacao);
    if (!s || s.tipo !== 'anuncio' || s.status !== 'pendente') ERR('Este anúncio não está mais disponível.');
    if (s.solicitante_id !== eu.id && eu.papel !== 'coordenador') ERR('Só quem anunciou ou a coordenação escolhe o candidato.');
    if (!DB.candidaturas.some(c => c.solicitacao_id === s.id && c.medico_id === a.p_medico && c.status === 'ativa')) ERR('Esse candidato não está mais disponível.');
    const pl = dP(s.plantao_id);
    if (dConf(a.p_medico, pl.inicio, pl.fim)) ERR('Esse candidato já tem plantão nesse horário.');
    s.destinatario_id = a.p_medico; s.aceito_em = agoraISO();
    DB.candidaturas.filter(c => c.solicitacao_id === s.id && c.status === 'ativa').forEach(c => { c.status = c.medico_id === a.p_medico ? 'escolhida' : 'nao_escolhida'; });
    if (dExige(s.plantao_id) && eu.papel !== 'coordenador') { s.status = 'aguardando_coordenador'; return 'aguardando_coordenador'; }
    s.decidido_por = eu.id; dExec(s, eu.id); return 'concluida';
  },
  cancelar_solicitacao(eu, a) {
    const s = DB.solicitacoes.find(x => x.id === a.p_solicitacao);
    if (!s || (s.solicitante_id !== eu.id && eu.papel !== 'coordenador')) ERR('Pedido não encontrado.');
    if (!ativa(s)) ERR('Este pedido já foi encerrado.');
    s.status = 'cancelada'; s.decidido_por = eu.id; voltaStatus(dP(s.plantao_id));
    DB.candidaturas.forEach(c => { if (c.solicitacao_id === s.id && c.status === 'ativa') c.status = 'cancelada'; });
  },
  dividir_plantao(eu, a) {
    const pl = dP(a.p_plantao); if (!pl) ERR('Plantão não encontrado.');
    const coord = eu.papel === 'coordenador';
    if (pl.medico_id !== eu.id && !coord) ERR('Este plantão não é seu.');
    const st = DB.setores.find(s => s.id === pl.setor_id);
    if (!st.permite_divisao && !coord) ERR('A divisão não é permitida neste setor.');
    if (D(pl.inicio) <= new Date() && !coord) ERR('Esse plantão já começou.');
    if (DB.solicitacoes.some(s => ativa(s) && (s.plantao_id === pl.id || s.plantao_contra_id === pl.id))) ERR('Cancele o pedido em andamento antes de dividir.');
    const ponto = D(a.p_ponto);
    if (ponto - D(pl.inicio) < 36e5 || D(pl.fim) - ponto < 36e5) ERR('Cada parte precisa ter pelo menos 1 hora.');
    let v1 = null, v2 = null;
    if (pl.valor != null) { v1 = Math.round(pl.valor * (ponto - D(pl.inicio)) / (D(pl.fim) - D(pl.inicio)) * 100) / 100; v2 = Math.round((pl.valor - v1) * 100) / 100; }
    DB.historico.push({ id: uid(), hospital_id: pl.hospital_id, tipo: 'divisao', plantao_id: pl.id, solicitacao_id: null, de_medico_id: pl.medico_id, para_medico_id: pl.medico_id, setor_id: pl.setor_id, inicio: pl.inicio, fim: pl.fim, detalhes: `Dividido às ${dm(ponto)} ${hm(ponto)}`, feito_por: eu.id, criado_em: agoraISO() });
    const novo = { ...clone(pl), id: uid(), inicio: ponto.toISOString(), valor: v2, origem_id: pl.id, checkin_em: null, checkout_em: null, status: pl.medico_id ? 'designado' : 'vago', criado_em: agoraISO() };
    pl.fim = ponto.toISOString(); pl.valor = v1; DB.plantoes.push(novo);
    return novo.id;
  },
  registrar_presenca(eu, a) {
    const pl = dP(a.p_plantao); if (!pl || pl.medico_id !== eu.id) ERR('Plantão não encontrado.');
    const agora = new Date();
    if (a.p_acao === 'entrada') {
      if (agora < D(pl.inicio) - 2 * 36e5 || agora > D(pl.fim)) ERR('A entrada pode ser registrada de 2h antes do início até o fim do plantão.');
      pl.checkin_em = pl.checkin_em || agoraISO();
    } else { if (!pl.checkin_em) ERR('Registre a entrada primeiro.'); pl.checkout_em = pl.checkout_em || agoraISO(); }
  },
  atualizar_meu_perfil(eu, a) {
    if (!(a.p_nome || '').trim() || !(a.p_crm || '').trim()) ERR('Preencha nome completo e CRM.');
    Object.assign(eu, { nome: a.p_nome.trim(), crm: a.p_crm.trim(), uf_crm: (a.p_uf || '').toUpperCase(), especialidade: (a.p_especialidade || '').trim() || null, telefone: (a.p_telefone || '').trim() || null, cadastro_completo: true, aceite_lgpd_em: eu.aceite_lgpd_em || agoraISO() });
  },
  redefinir_senha(eu) { if (eu.papel !== 'coordenador') ERR('Só a coordenação redefine senhas.'); },
};

const Demo = {
  usuario: null,
  async sessao() { return this.usuario ? { id: this.usuario } : null; },
  async login(email) { const p = DB.perfis.find(x => norm(x.email) === norm(email)); if (!p) ERR('Na demonstração, use um dos acessos rápidos.'); this.usuario = p.id; return { id: p.id }; },
  async sair() { this.usuario = null; },
  async trocarSenha() {},
  async perfilDe(id) { const p = DB.perfis.find(x => x.id === id); return p ? clone(p) : null; },
  async carregar(de, ate) {
    const eu = DB.perfis.find(p => p.id === this.usuario); const coord = eu.papel === 'coordenador';
    const desde = addDias(new Date(), -60);
    const sols = DB.solicitacoes.filter(s => (coord || s.tipo === 'anuncio' || s.solicitante_id === eu.id || s.destinatario_id === eu.id) && (ativa(s) || D(s.criado_em) >= desde))
      .sort((a, b) => D(b.criado_em) - D(a.criado_em));
    const ids = new Set(sols.flatMap(s => [s.plantao_id, s.plantao_contra_id]));
    const plantoes = DB.plantoes.filter(p => (D(p.inicio) >= de && D(p.inicio) < ate) || ids.has(p.id)).sort(porInicio);
    const anuncios = new Set(sols.filter(s => s.tipo === 'anuncio').map(s => s.id));
    return clone({ hospital: DB.hospitais[0], setores: DB.setores, perfis: DB.perfis, plantoes, sols, cands: DB.candidaturas.filter(c => anuncios.has(c.solicitacao_id)) });
  },
  async plantoesPeriodo(de, ate) { return clone(DB.plantoes.filter(p => D(p.inicio) >= de && D(p.inicio) < ate).sort(porInicio)); },
  async historico(de, ate) {
    const eu = DB.perfis.find(p => p.id === this.usuario); const coord = eu.papel === 'coordenador';
    return clone(DB.historico.filter(h => D(h.inicio) >= de && D(h.inicio) < ate && (coord || [h.de_medico_id, h.para_medico_id, h.feito_por].includes(eu.id))).sort(porInicio));
  },
  async rpc(nome, a) {
    const eu = DB.perfis.find(p => p.id === this.usuario);
    if (!eu || !eu.ativo) ERR('Seu acesso não está ativo. Fale com a coordenação.');
    return DemoRPC[nome](eu, a || {});
  },
  async salvar(t, row) {
    const tab = DB[t]; const atual = row.id && tab.find(x => x.id === row.id);
    if (t === 'perfis' && row.nome_na_escala && DB.perfis.some(p => p.id !== row.id && norm(p.nome_na_escala) === norm(row.nome_na_escala))) ERR('Já existe um médico com esse nome na escala.');
    if (t === 'setores' && DB.setores.some(s => s.id !== row.id && norm(s.nome) === norm(row.nome))) ERR('Esse registro já existe.');
    if (atual) { Object.assign(atual, row); return clone(atual); }
    const novo = { criado_em: agoraISO(), ...row, id: uid() }; tab.push(novo); return clone(novo);
  },
  async excluir(t, id) {
    DB[t] = DB[t].filter(x => x.id !== id);
    if (t === 'plantoes') { DB.solicitacoes = DB.solicitacoes.filter(s => s.plantao_id !== id && s.plantao_contra_id !== id); DB.historico.forEach(h => { if (h.plantao_id === id) h.plantao_id = null; }); }
  },
  async inserirVarios(t, rows) { rows.forEach(r => DB[t].push({ criado_em: agoraISO(), checkin_em: null, checkout_em: null, origem_id: null, ...r, id: uid() })); },
  ouvir() {},
};

function seedDemo() {
  const H = { id: uid(), nome: NOME_HOSPITAL || 'Hospital', cidade: 'Nova Friburgo/RJ', criado_em: agoraISO() };
  const CM = { id: uid(), hospital_id: H.id, nome: 'Clínica Médica', cor: '#971232', exige_aprovacao: false, permite_divisao: true, ativo: true };
  const PS = { id: uid(), hospital_id: H.id, nome: 'Pronto-Socorro', cor: '#7E3A87', exige_aprovacao: true, permite_divisao: true, ativo: true };
  let n = 0;
  const med = (nome, escala, papel, setores, esp) => ({ id: uid(), hospital_id: H.id, email: norm(escala).replace(/[^a-z]+/g, '.') + '@demo.app', nome, nome_na_escala: escala, crm: String(52000 + (++n) * 137), uf_crm: 'RJ', especialidade: esp, telefone: '', papel, setores, ativo: true, cadastro_completo: true, criado_em: agoraISO() });
  const co = med('Coordenação da Escala', 'Coordenação', 'coordenador', [CM.id, PS.id], 'Clínica Médica');
  const mi = med('Maria Isabel', 'Maria Isabel', 'medico', [CM.id], 'Clínica Médica');
  const pe = med('Pedro', 'Pedro', 'medico', [CM.id, PS.id], 'Clínica Médica');
  const ka = med('Kaio', 'Kaio', 'medico', [CM.id, PS.id], 'Clínica Médica');
  const ma = med('Manuelle', 'Manuelle', 'medico', [CM.id, PS.id], 'Emergência');
  Object.assign(DB, { hospitais: [H], setores: [CM, PS], perfis: [co, mi, pe, ka, ma], plantoes: [], solicitacoes: [], candidaturas: [], historico: [] });

  const hoje = new Date();
  const add = (st, m, d, h, dur, tipo, valor) => {
    const i = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h);
    const p = { id: uid(), hospital_id: H.id, setor_id: st.id, medico_id: m ? m.id : null, inicio: i.toISOString(), fim: new Date(i.getTime() + dur * 36e5).toISOString(), tipo, valor, status: m ? 'designado' : 'vago', origem_id: null, checkin_em: null, checkout_em: null, observacao: null, criado_em: agoraISO() };
    DB.plantoes.push(p); return p;
  };
  const rot = [mi, pe, mi, ka, mi, pe, ka];
  for (let d = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1), k = 0; d < new Date(hoje.getFullYear(), hoje.getMonth() + 2, 1); d = addDias(d, 1), k++) {
    add(CM, rot[k % 7], d, 7, 24, 'P24', 1800);
    add(PS, k % 11 === 5 ? null : (k % 2 === 0 ? ma : co), d, 7, 12, 'D12', 1100);
    add(PS, k % 2 === 0 ? co : ma, d, 19, 12, 'N12', 1300);
  }
  const agora = Date.now();
  const usados = new Set();
  const achar = (m, dias, st = CM) => { const p = DB.plantoes.find(x => x.medico_id === m.id && x.setor_id === st.id && !usados.has(x.id) && D(x.inicio).getTime() > agora + dias * 864e5); if (p) usados.add(p.id); return p; };
  const pa = achar(mi, 4);
  if (pa) { pa.status = 'anunciado'; const s = novaSol({ tipo: 'anuncio', plantao_id: pa.id, solicitante_id: mi.id, mensagem: 'Congresso nesse dia. Quem puder, agradeço!', criado_em: new Date(agora - 26 * 36e5).toISOString() }); DB.solicitacoes.push(s); DB.candidaturas.push({ id: uid(), hospital_id: H.id, solicitacao_id: s.id, medico_id: ka.id, status: 'ativa', criado_em: new Date(agora - 20 * 36e5).toISOString() }); }
  const pk = achar(ka, 2), pp = achar(pe, 7);
  if (pk && pp) DB.solicitacoes.push(novaSol({ tipo: 'troca', plantao_id: pk.id, plantao_contra_id: pp.id, solicitante_id: ka.id, destinatario_id: pe.id, mensagem: 'Consegue trocar comigo? Tenho um compromisso de família.', criado_em: new Date(agora - 5 * 36e5).toISOString() }));
  const vaga = DB.plantoes.find(p => !p.medico_id && D(p.inicio).getTime() > agora + 864e5);
  if (vaga) { vaga.status = 'anunciado'; DB.solicitacoes.push(novaSol({ tipo: 'anuncio', plantao_id: vaga.id, solicitante_id: co.id, mensagem: 'Vaga aberta no Pronto-Socorro.' })); usados.add(vaga.id); }
  // movimentações já concluídas neste mês (para o relatório não começar vazio)
  const doMes = m => DB.plantoes.find(p => p.medico_id === m.id && p.setor_id === CM.id && !usados.has(p.id) && D(p.inicio).getMonth() === hoje.getMonth() && D(p.inicio).getFullYear() === hoje.getFullYear());
  const hist = (tipo, p, de, para, por) => DB.historico.push({ id: uid(), hospital_id: H.id, tipo, plantao_id: p.id, solicitacao_id: null, de_medico_id: de.id, para_medico_id: para.id, setor_id: p.setor_id, inicio: p.inicio, fim: p.fim, detalhes: null, feito_por: por.id, criado_em: new Date(D(p.inicio) - 3 * 864e5).toISOString() });
  const p1 = doMes(mi); if (p1) { usados.add(p1.id); hist('passagem', p1, mi, pe, pe); p1.medico_id = pe.id; }
  const p2 = doMes(pe), p3 = doMes(ka);
  if (p2 && p3) { usados.add(p2.id); usados.add(p3.id); hist('troca', p2, pe, ka, ka); hist('troca', p3, ka, pe, ka); p2.medico_id = ka.id; p3.medico_id = pe.id; }
  DEMO = [
    { id: co.id, rot: 'Coordenação', sub: 'Aprova pedidos, edita a escala e importa Excel' },
    { id: pe.id, rot: 'Pedro', sub: 'Médico: tem uma proposta de troca esperando' },
    { id: ka.id, rot: 'Kaio', sub: 'Médico: fez a proposta e se candidatou a um anúncio' },
  ];
}

const CORES_AV = ['#971232', '#7E3A87', '#C23A6B', '#9A5B1E', '#2F7F86', '#4E5AA8'];
function avatar(p, tam = 'w-10 h-10 text-[14px]') {
  if (!p) return `<div class="${tam} grid shrink-0 place-items-center rounded-full bg-linha font-bold text-grafite/50">${ic('user', 'w-1/2 h-1/2')}</div>`;
  const ini = nomeCurto(p).split(/\s+/).filter(Boolean).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  let h = 0; for (const ch of String(p.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `<div class="${tam} grid shrink-0 place-items-center rounded-full font-bold text-white" style="background:${CORES_AV[h % CORES_AV.length]}">${esc(ini)}</div>`;
}
function marca(c = 'w-12 h-12') {
  if (LOGO_URL) return `<img src="${esc(LOGO_URL)}" alt="" class="${c} rounded-2xl bg-white object-contain p-1">`;
  return `<div class="${c} grid shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-ameixa via-vinho-600 to-magenta text-white shadow-sm"><svg viewBox="0 0 24 24" class="h-3/5 w-3/5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h4l2.5-6 4 11 3-7 1.5 2H22"/></svg></div>`;
}
function topo(titulo, { voltar = false, direita = '' } = {}) {
  return `<header class="sticky top-0 z-20 bg-vinho-700 text-white safe-t">
    <div class="mx-auto flex h-14 max-w-3xl items-center gap-1 px-2">
      ${voltar ? `<button onclick="history.back()" class="grid h-11 w-11 place-items-center rounded-full hover:bg-white/10" aria-label="Voltar">${ic('chevL', 'w-6 h-6')}</button>` : '<div class="w-3"></div>'}
      <h1 class="min-w-0 flex-1 truncate text-[17px] font-bold">${titulo}</h1>${direita}
    </div></header>`;
}
const main = (html, extra = '') => `<main class="mx-auto max-w-3xl px-4 py-4 ${extra}">${html}</main>`;
const secao = (titulo, html) => `<h2 class="mb-2 mt-6 text-[15px] font-bold text-grafite/80">${titulo}</h2>${html}`;
const vazio = (texto, acao = '') => `<div class="card px-5 py-8 text-center text-[15px] text-grafite/60">${texto}${acao ? `<div class="mt-4">${acao}</div>` : ''}</div>`;
const abas = (itens, atual, fn) => `<div class="sem-barra -mx-4 mb-4 flex gap-2 overflow-x-auto px-4">${itens.map(([v, t, n]) =>
  `<button onclick="${fn}('${v}')" class="chip ${atual === v ? 'chip-on' : ''}">${t}${n ? `<span class="ml-1 rounded-full ${atual === v ? 'bg-white/25' : 'bg-vinho-50 text-vinho-700'} px-1.5 text-[11px]">${n}</span>` : ''}</button>`).join('')}</div>`;
const statusTag = st => `<span class="tag ${STATUS[st][1]}">${STATUS[st][0]}</span>`;
const miniPlantao = p => p ? `<div class="flex items-center gap-2 text-[14px]"><span class="h-2 w-2 shrink-0 rounded-full" style="background:${corTipo(p.tipo)}"></span><span><b>${dataCurta(D(p.inicio))}</b> ${faixa(p)} <span class="text-grafite/55">${fmtH(horas(p))} · ${esc(setor(p.setor_id)?.nome || '')}</span></span></div>` : '<div class="text-[14px] text-grafite/50">Plantão fora do período carregado</div>';

function cardPlantao(p, { comMedico = false } = {}) {
  const agora = new Date(); const andando = D(p.inicio) <= agora && D(p.fim) > agora; const sol = solAtiva(p.id);
  const extra = andando ? '<span class="tag bg-emerald-50 text-emerald-700">Em andamento</span>'
    : p.status === 'anunciado' ? '<span class="tag bg-amber-50 text-amber-700">Anunciado</span>'
    : sol ? `<span class="tag bg-vinho-50 text-vinho-700">${sol.tipo === 'troca' ? 'Troca' : 'Passagem'} em andamento</span>`
    : !p.medico_id ? '<span class="tag bg-zinc-100 text-zinc-600">Vago</span>' : '';
  return `<button onclick="ir('plantao',{id:'${p.id}'})" class="card flex w-full items-stretch overflow-hidden text-left transition hover:ring-vinho-200">
    <div class="w-1.5 shrink-0" style="background:${corTipo(p.tipo)}"></div>
    <div class="tnum flex w-[4.5rem] shrink-0 flex-col items-center justify-center border-r border-linha py-3"><span class="text-[16px] font-bold">${hm(D(p.inicio))}</span><span class="text-[13px] text-grafite/55">${hm(D(p.fim))}</span></div>
    <div class="min-w-0 flex-1 px-3 py-2.5">
      <div class="text-[13px] font-semibold text-grafite/60">${dataCurta(D(p.inicio))} · ${fmtH(horas(p))}</div>
      <div class="truncate text-[16px] font-bold">${esc(setor(p.setor_id)?.nome || 'Setor')}</div>
      <div class="mt-1 flex flex-wrap items-center gap-1.5 text-[13px] text-grafite/60">${comMedico ? esc(nomeCurto(perfil(p.medico_id))) : esc(S.hospital?.nome || NOME_HOSPITAL)} ${extra}</div>
    </div><div class="grid place-items-center pr-3 text-grafite/30">${ic('chevR', 'w-4 h-4')}</div></button>`;
}

function contarRecebidas() { return S.sols.filter(s => s.tipo !== 'anuncio' && s.status === 'pendente' && s.destinatario_id === S.eu?.id && !expirada(s)).length; }
function contarPendencias() { return contarRecebidas() + (souCoord() ? S.sols.filter(s => s.status === 'aguardando_coordenador' && !expirada(s)).length : 0); }
function anunciosDisponiveis() {
  return S.sols.filter(s => s.tipo === 'anuncio' && s.status === 'pendente' && s.solicitante_id !== S.eu.id && !expirada(s)
    && plantao(s.plantao_id) && plantao(s.plantao_id).medico_id !== S.eu.id && apto(S.eu, plantao(s.plantao_id).setor_id));
}
function contarAnuncios() { return anunciosDisponiveis().filter(s => !S.cands.some(c => c.solicitacao_id === s.id && c.medico_id === S.eu.id && c.status === 'ativa')).length; }

function shell(conteudo) {
  const itens = [['home', 'home', 'Início'], ['agenda', 'calendar', 'Agenda'], ['anuncios', 'megaphone', 'Anúncios', contarAnuncios()], ['pendencias', 'inbox', 'Pendências', contarPendencias()], ['mais', 'menu', 'Mais']];
  const raiz = { home: 'home', agenda: 'agenda', anuncios: 'anuncios', pendencias: 'pendencias' }[S.view] || (['plantao', 'trocar', 'dividir'].includes(S.view) ? (S.pilha[0]?.view === 'home' && S.pilha.length === 1 ? 'home' : (S.pilha[S.pilha.length - 1]?.view || 'agenda')) : 'mais');
  const nav = itens.map(([v, i, t, b]) => `<button onclick="irRaiz('${v}')" class="relative flex flex-1 flex-col items-center gap-0.5 py-2 text-[11px] font-semibold lg:flex-none lg:flex-row lg:gap-3 lg:rounded-xl lg:px-4 lg:py-3 lg:text-[15px] ${raiz === v ? 'text-vinho-600 lg:bg-vinho-50' : 'text-grafite/55 hover:text-grafite'}">
    <span class="relative">${ic(i, 'w-6 h-6')}${b ? `<span class="absolute -right-2.5 -top-1.5 min-w-[18px] rounded-full bg-magenta px-1 text-center text-[10px] font-bold leading-[18px] text-white">${b}</span>` : ''}</span>${t}</button>`).join('');
  return `<div class="min-h-screen pb-24 lg:pb-8 lg:pl-64">${conteudo}</div>
  <nav class="fixed inset-x-0 bottom-0 z-30 border-t border-linha bg-white/95 backdrop-blur safe-b lg:inset-y-0 lg:right-auto lg:w-64 lg:border-r lg:border-t-0 lg:px-3 lg:pt-6">
    <div class="hidden lg:mb-6 lg:flex lg:items-center lg:gap-3 lg:px-2">${marca('w-11 h-11')}<div><div class="font-extrabold leading-tight text-vinho-700">${esc(NOME_APP)}</div><div class="text-[13px] text-grafite/60">${esc(S.hospital?.nome || NOME_HOSPITAL)}</div></div></div>
    <div class="mx-auto flex max-w-lg lg:max-w-none lg:flex-col lg:gap-1">${nav}</div>
  </nav>`;
}

function vHome() {
  const agora = new Date(); const hoje = inicioDia(agora); const ontem = addDias(hoje, -1); const amanha = addDias(hoje, 1);
  const meus = S.plantoes.filter(ehMeu).sort(porInicio);
  const deOntem = meus.filter(p => D(p.inicio) >= ontem && D(p.inicio) < hoje);
  const deHoje = meus.filter(p => D(p.inicio) >= hoje && D(p.inicio) < amanha);
  const proximos = meus.filter(p => D(p.inicio) >= amanha).slice(0, 6);
  const andamento = meus.filter(p => D(p.inicio) <= agora && D(p.fim) > agora);
  const doMes = meus.filter(p => D(p.inicio).getMonth() === agora.getMonth() && D(p.inicio).getFullYear() === agora.getFullYear());
  const hMes = doMes.reduce((a, p) => a + horas(p), 0);
  const h = agora.getHours(); const [saud, icone] = h < 12 ? ['Bom dia!', 'sun'] : h < 18 ? ['Boa tarde!', 'sun'] : ['Boa noite!', 'moon'];
  const receb = contarRecebidas(); const aprov = souCoord() ? S.sols.filter(s => s.status === 'aguardando_coordenador' && !expirada(s)).length : 0;
  const disp = contarAnuncios(); const vagos = souCoord() ? S.plantoes.filter(p => !p.medico_id && p.status !== 'anunciado' && D(p.inicio) > agora).length : 0;
  const anim = S.animou ? 'pronto' : ''; S.animou = true;
  const aviso = (cor, icn, txt, onclick) => `<button onclick="${onclick}" class="card flex w-full items-center gap-3 p-3.5 text-left hover:ring-vinho-200"><div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl ${cor}">${ic(icn)}</div><div class="flex-1 text-[15px] font-semibold">${txt}</div>${ic('chevR', 'w-4 h-4 text-grafite/30')}</button>`;
  const avisos = [
    receb ? aviso('bg-magenta/10 text-magenta', 'inbox', `${plural(receb, 'pedido espera', 'pedidos esperam')} sua resposta`, "S.pendTab='recebidas';irRaiz('pendencias')") : '',
    aprov ? aviso('bg-ameixa/10 text-ameixa', 'check', `${plural(aprov, 'pedido aguarda', 'pedidos aguardam')} sua aprovação`, "S.pendTab='aprovar';irRaiz('pendencias')") : '',
    disp ? aviso('bg-amber-50 text-amber-600', 'megaphone', `${plural(disp, 'plantão anunciado que você pode assumir', 'plantões anunciados que você pode assumir')}`, "S.anTab='disponiveis';irRaiz('anuncios')") : '',
    vagos ? aviso('bg-zinc-100 text-zinc-600', 'alert', `${plural(vagos, 'plantão vago', 'plantões vagos')} na escala`, "S.admTab='plantoes';ir('admin')") : '',
  ].join('');
  const lista = (arr, vazioTxt) => arr.length ? `<div class="space-y-2">${arr.map(p => cardPlantao(p)).join('')}</div>` : `<p class="card px-4 py-3 text-[14px] text-grafite/55">${vazioTxt}</p>`;
  return `<section class="relative overflow-hidden bg-gradient-to-br from-vinho-800 via-vinho-600 to-magenta text-white safe-t">
      <svg class="pulso ${anim} pointer-events-none absolute inset-x-0 bottom-3 h-24 w-full opacity-25" viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 62 H130 L145 62 L160 22 L180 92 L196 42 L207 62 H400" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
      <div class="relative mx-auto max-w-3xl px-5 pb-9 pt-4">
        <div class="flex items-center justify-between"><span class="text-[14px] font-semibold text-white/80">${esc(S.hospital?.nome || NOME_HOSPITAL)}</span>
          <button onclick="irRaiz('pendencias')" class="relative grid h-10 w-10 place-items-center rounded-full hover:bg-white/10" aria-label="Pendências">${ic('inbox', 'w-6 h-6')}${contarPendencias() ? '<span class="absolute right-1.5 top-1.5 h-2.5 w-2.5 rounded-full bg-amber-300"></span>' : ''}</button></div>
        <div class="mt-4 flex items-start justify-between gap-4">
          <div class="min-w-0"><p class="flex items-center gap-2 text-[34px] font-extrabold leading-none tracking-tight">${saud} ${ic(icone, 'w-7 h-7 text-amber-200')}</p>
            <p class="mt-2 truncate text-[18px] font-bold text-amber-100">${esc(S.eu.nome || nomeCurto(S.eu))}</p>
            <p class="mt-0.5 text-[15px] text-white/85">${andamento.length ? `Você tem <b>${plural(andamento.length, 'plantão', 'plantões')} em andamento</b>.` : 'Nenhum plantão em andamento agora.'}</p>
            <p class="mt-3 text-[14px] text-white/75">Em ${MESES[agora.getMonth()].toLowerCase()}: ${plural(doMes.length, 'plantão', 'plantões')}, ${fmtH(hMes)}</p></div>
          ${avatar(S.eu, 'w-16 h-16 text-[22px] ring-4 ring-white/25')}
        </div></div></section>
    ${main(`${avisos ? `<div class="space-y-2">${avisos}</div>` : ''}
      ${secao(`Plantões de ontem, ${dm(ontem)}`, lista(deOntem, 'Nenhum plantão ontem.'))}
      ${secao(`Plantões de hoje, ${dm(hoje)}`, lista(deHoje, 'Nenhum plantão hoje.'))}
      ${secao('Próximos plantões', lista(proximos, 'Nenhum plantão marcado para os próximos dias.'))}
      <button class="btn btn-s mt-4 w-full" onclick="S.agendaModo='minha';irRaiz('agenda')">${ic('calendar')} Ver minha agenda completa</button>`)}`;
}

function vAgenda() {
  const ano = S.mes.getFullYear(), mes = S.mes.getMonth();
  const filtro = p => (!S.filtroSetor || p.setor_id === S.filtroSetor) && (S.agendaModo === 'geral' || ehMeu(p));
  const doMes = S.plantoes.filter(p => { const d = D(p.inicio); return d.getFullYear() === ano && d.getMonth() === mes && filtro(p); });
  const porDia = {}; doMes.forEach(p => (porDia[ymd(D(p.inicio))] = porDia[ymd(D(p.inicio))] || []).push(p));
  let cels = ''; for (let i = 0; i < new Date(ano, mes, 1).getDay(); i++) cels += '<div></div>';
  const nDias = new Date(ano, mes + 1, 0).getDate(); const hojeK = ymd(new Date());
  for (let d = 1; d <= nDias; d++) {
    const k = `${ano}-${pad(mes + 1)}-${pad(d)}`; const ps = porDia[k] || []; const sel = S.dia === k;
    const dots = [ps.some(ehMeu) && 'bg-magenta', ps.some(p => p.medico_id && !ehMeu(p)) && 'bg-vinho-600', ps.some(p => p.status === 'anunciado') && 'bg-ambar', ps.some(p => !p.medico_id) && 'bg-zinc-400'].filter(Boolean);
    cels += `<button onclick="selDia('${k}')" class="flex h-12 flex-col items-center justify-center rounded-xl ${sel ? 'bg-vinho-600 text-white' : k === hojeK ? 'font-extrabold text-vinho-600 ring-1 ring-vinho-200' : 'hover:bg-vinho-50'}">
      <span class="tnum text-[15px] font-semibold">${d}</span><span class="mt-0.5 flex h-1.5 gap-0.5">${dots.map(c => `<i class="h-1.5 w-1.5 rounded-full ${sel ? 'bg-white' : c}"></i>`).join('')}</span></button>`;
  }
  const doDia = (porDia[S.dia] || []).sort(porInicio);
  const grupos = {}; doDia.forEach(p => (grupos[p.setor_id] = grupos[p.setor_id] || []).push(p));
  const dSel = new Date(S.dia + 'T12:00');
  const listaDia = doDia.length ? Object.entries(grupos).map(([sid, ps]) => `<h3 class="mb-2 mt-4 flex items-center gap-2 text-[14px] font-bold text-vinho-700"><span class="h-2.5 w-2.5 rounded-full" style="background:${esc(setor(sid)?.cor || '#971232')}"></span>${esc(setor(sid)?.nome || 'Setor')}</h3><div class="space-y-2">${ps.map(itemEscala).join('')}</div>`).join('')
    : vazio(S.agendaModo === 'minha' ? 'Você não tem plantão neste dia.' : 'Nenhum plantão neste dia.', souCoord() ? `<button class="btn btn-s" onclick="abrirPlantaoForm()">${ic('plus')} Criar plantão</button>` : '');
  const meusMes = S.agendaModo === 'minha' ? S.plantoes.filter(p => ehMeu(p) && D(p.inicio).getMonth() === mes && D(p.inicio).getFullYear() === ano).sort(porInicio) : [];
  const setoresChips = [['', 'Todos os setores'], ...S.setores.filter(s => s.ativo).map(s => [s.id, s.nome])];
  return topo(`<div class="flex items-center justify-center gap-1"><button onclick="mudarMes(-1)" class="grid h-10 w-10 place-items-center rounded-full hover:bg-white/10" aria-label="Mês anterior">${ic('chevL')}</button><span class="w-40 text-center">${MESES[mes]} ${ano}</span><button onclick="mudarMes(1)" class="grid h-10 w-10 place-items-center rounded-full hover:bg-white/10" aria-label="Próximo mês">${ic('chevR')}</button></div>`,
    { direita: souCoord() ? `<button onclick="abrirPlantaoForm()" class="grid h-11 w-11 place-items-center rounded-full hover:bg-white/10" aria-label="Novo plantão">${ic('plus', 'w-6 h-6')}</button>` : '<div class="w-11"></div>' })
  + main(`
    <div class="mb-3 grid grid-cols-2 rounded-xl bg-white p-1 ring-1 ring-linha">
      ${[['geral', 'Agenda geral'], ['minha', 'Minha agenda']].map(([v, t]) => `<button onclick="S.agendaModo='${v}';render()" class="rounded-lg py-2 text-[14px] font-bold ${S.agendaModo === v ? 'bg-vinho-600 text-white' : 'text-grafite/60'}">${t}</button>`).join('')}</div>
    ${S.setores.length > 1 ? `<div class="sem-barra -mx-4 mb-3 flex gap-2 overflow-x-auto px-4">${setoresChips.map(([id, n]) => `<button onclick="S.filtroSetor='${id}';render()" class="chip ${S.filtroSetor === id ? 'chip-on' : ''}">${esc(n)}</button>`).join('')}</div>` : ''}
    <div class="card p-3">
      <div class="mb-1 grid grid-cols-7 text-center text-[12px] font-bold text-grafite/45">${DIAS.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1">${cels}</div>
      <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1 border-t border-linha pt-2 text-[12px] text-grafite/60">
        <span class="flex items-center gap-1"><i class="h-2 w-2 rounded-full bg-magenta"></i>Seu</span><span class="flex items-center gap-1"><i class="h-2 w-2 rounded-full bg-vinho-600"></i>Colegas</span>
        <span class="flex items-center gap-1"><i class="h-2 w-2 rounded-full bg-ambar"></i>Anunciado</span><span class="flex items-center gap-1"><i class="h-2 w-2 rounded-full bg-zinc-400"></i>Vago</span></div>
    </div>
    <h2 class="mt-5 text-[17px] font-extrabold">${dataLonga(dSel)}</h2>
    ${listaDia}
    ${S.agendaModo === 'minha' ? secao(`Todos os seus plantões em ${MESES[mes].toLowerCase()}`, meusMes.length ? `<div class="space-y-2">${meusMes.map(p => cardPlantao(p)).join('')}</div>` : vazio('Nenhum plantão seu neste mês.')) : ''}`);
}
function itemEscala(p) {
  const med = perfil(p.medico_id); const anun = p.status === 'anunciado'; const meu = ehMeu(p);
  const nome = anun ? (med ? `Anúncio de ${esc(nomeCurto(med))}` : 'Vaga anunciada') : med ? esc(nomeCurto(med)) + (meu ? ' (você)' : '') : 'Plantão vago';
  return `<button onclick="tocarPlantao('${p.id}')" class="card flex w-full items-center gap-3 px-3 py-2.5 text-left transition hover:ring-vinho-200 ${meu ? '!ring-2 !ring-magenta/40' : ''}">
    ${anun ? `<div class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-ambar text-white">${ic('megaphone')}</div>` : avatar(med)}
    <div class="tnum w-12 shrink-0 text-[13px] leading-tight ${anun ? 'text-amber-600' : 'text-grafite/70'}"><div>${hm(D(p.inicio))}</div><div>${hm(D(p.fim))}</div><div class="mt-1 h-0.5 rounded" style="background:${corTipo(p.tipo)}"></div></div>
    <div class="min-w-0 flex-1"><div class="truncate text-[15px] font-semibold ${anun ? 'text-amber-700' : !med ? 'text-grafite/50' : ''}">${nome}</div><div class="text-[13px] font-bold text-grafite/60">${fmtH(horas(p))} <span class="font-medium">${esc(p.tipo || '')}</span></div></div>
    ${ic('chevR', 'w-4 h-4 text-grafite/30')}</button>`;
}

function vPlantao() {
  const p = plantao(S.params.id);
  if (!p) return topo('Plantão', { voltar: true }) + main(vazio('Este plantão não está mais na escala. Ele pode ter sido excluído ou dividido.'));
  const st = setor(p.setor_id); const med = perfil(p.medico_id); const meu = ehMeu(p); const coord = souCoord();
  const agora = new Date(); const futuro = D(p.inicio) > agora; const sol = solAtiva(p.id);
  const linha = (icn, rot, val, extra = '') => `<div class="card flex items-start gap-3 p-4"><div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-vinho-50 text-vinho-600">${icn}</div><div class="min-w-0 flex-1"><div class="text-[13px] text-grafite/55">${rot}</div><div class="text-[16px] font-semibold">${val}</div>${extra}</div></div>`;
  const statusTxt = { designado: 'Plantão designado', anunciado: 'Plantão anunciado', vago: 'Plantão vago' }[p.status];
  const acaoBtn = (icn, t, sub, fn, cor = 'text-vinho-600 bg-vinho-50') => `<button onclick="${fn}" class="card flex w-full items-center gap-3 p-3.5 text-left hover:ring-vinho-200"><div class="grid h-10 w-10 shrink-0 place-items-center rounded-xl ${cor}">${ic(icn)}</div><div class="flex-1"><div class="text-[15px] font-bold">${t}</div><div class="text-[13px] text-grafite/60">${sub}</div></div>${ic('chevR', 'w-4 h-4 text-grafite/30')}</button>`;
  let acoes = '';
  if (sol) {
    const outro = perfil(sol.tipo === 'anuncio' ? null : (sol.solicitante_id === S.eu.id ? sol.destinatario_id : sol.solicitante_id));
    acoes += `<div class="card p-4"><div class="flex items-center justify-between gap-2"><b class="text-[15px]">${ROTULO[sol.tipo]}</b>${statusTag(sol.status)}</div>
      <p class="mt-1 text-[14px] text-grafite/70">${sol.tipo === 'anuncio' ? `${plural(S.cands.filter(c => c.solicitacao_id === sol.id && c.status === 'ativa').length, 'candidato', 'candidatos')} até agora.` : `Com ${esc(nomeCurto(outro))}.`}</p>
      <div class="mt-3 flex flex-wrap gap-2">${sol.tipo === 'anuncio' ? `<button class="btn btn-s" onclick="S.anTab='meus';irRaiz('anuncios')">Ver anúncio</button>` : `<button class="btn btn-s" onclick="S.pendTab='${sol.solicitante_id === S.eu.id ? 'enviados' : 'recebidas'}';irRaiz('pendencias')">Ver pedido</button>`}
      ${(sol.solicitante_id === S.eu.id || coord) ? `<button class="btn btn-g" onclick="cancelarPedido('${sol.id}')">Cancelar pedido</button>` : ''}</div></div>`;
  } else if (futuro && (meu || (coord && !p.medico_id))) {
    acoes += acaoBtn('megaphone', meu ? 'Anunciar plantão' : 'Anunciar vaga', 'Colegas habilitados no setor podem se candidatar', `anunciar('${p.id}')`, 'bg-amber-50 text-amber-600');
    if (meu) acoes += acaoBtn('swap', 'Passar ou trocar', 'Escolha um colega e proponha', `ir('trocar',{id:'${p.id}'})`);
  }
  if (!sol && (meu || coord) && (futuro || coord) && (st?.permite_divisao || coord) && horas(p) >= 2) acoes += acaoBtn('scissors', 'Dividir plantão', 'Transforma em 2 plantões menores', `ir('dividir',{id:'${p.id}'})`, 'bg-ameixa/10 text-ameixa');
  if (coord) acoes += `<div class="grid grid-cols-2 gap-2"><button class="btn btn-s" onclick="abrirPlantaoForm('${p.id}')">${ic('edit')} Editar</button><button class="btn btn-s !text-red-700 !ring-red-200" onclick="excluirPlantao('${p.id}')">${ic('trash')} Excluir</button></div>`;
  let pres = '';
  if (meu) {
    if (p.checkin_em) pres = `<div class="text-[13px] text-grafite/60">Entrada ${hm(D(p.checkin_em))}${p.checkout_em ? `, saída ${hm(D(p.checkout_em))}` : ''}</div>`;
    if (!p.checkin_em && agora >= D(p.inicio) - 2 * 36e5 && agora < D(p.fim)) pres += `<button class="btn btn-p" onclick="presenca('${p.id}','entrada')">${ic('clock')} Registrar entrada</button>`;
    else if (p.checkin_em && !p.checkout_em) pres += `<button class="btn btn-s !ring-red-200 !text-red-700" onclick="presenca('${p.id}','saida')">${ic('clock')} Encerrar</button>`;
  }
  return topo('Plantão', { voltar: true }) + main(`<div class="space-y-2">
    ${linha(ic('building'), esc(st?.nome || 'Setor'), esc(S.hospital?.nome || NOME_HOSPITAL), `<div class="mt-0.5 text-[14px] font-semibold ${p.status === 'anunciado' ? 'text-amber-600' : p.status === 'vago' ? 'text-grafite/50' : 'text-vinho-600'}">${statusTxt}</div>`)}
    ${linha(avatar(med, 'w-10 h-10 text-[14px]'), 'Médico', med ? esc(med.nome || nomeCurto(med)) + (meu ? ' (você)' : '') : 'Ninguém escalado', med ? `<div class="text-[13px] text-grafite/60">${med.crm ? `CRM ${esc(med.crm)}/${esc(med.uf_crm || '')}` : ''}</div>${!meu ? `<button class="mt-1 text-[14px] font-bold text-vinho-600" onclick="contato('${med.id}')">Ver contato</button>` : ''}` : '')}
    ${p.valor != null ? linha(ic('money'), 'Valor', dinheiro(p.valor)) : ''}
    ${linha(`<span class="h-5 w-5 rounded-md" style="background:${corTipo(p.tipo)}"></span>`, 'Tipo', esc(TIPOS[p.tipo]?.nome || p.tipo || '—'))}
    ${p.observacao ? linha(ic('note'), 'Observação', esc(p.observacao)) : ''}
    ${p.origem_id ? `<p class="px-1 text-[13px] text-grafite/55">Este plantão nasceu da divisão de outro plantão.</p>` : ''}
  </div>
  <div class="card mt-3 flex flex-wrap items-center justify-between gap-3 p-4">
    <div><div class="flex items-center gap-2 text-[15px] font-bold">${ic('calendar', 'w-4 h-4 text-vinho-600')}${dataLonga(D(p.inicio))}</div><div class="tnum mt-1 flex items-center gap-2 text-[15px]">${ic('clock', 'w-4 h-4 text-vinho-600')}${faixa(p)} <span class="text-grafite/55">(${fmtH(horas(p))})</span></div></div>
    <div class="flex flex-col items-end gap-1">${pres}</div></div>
  ${acoes ? secao('O que você pode fazer', `<div class="space-y-2">${acoes}</div>`) : ''}`);
}

function blocoPessoa(p, pessoa, rotulo) {
  return `<div class="card p-4"><div class="flex items-center gap-3">${avatar(pessoa)}<div class="min-w-0"><div class="text-[12px] text-grafite/55">${rotulo}</div><div class="truncate text-[16px] font-bold text-vinho-700">${esc(pessoa ? (pessoa.nome || nomeCurto(pessoa)) : '')}</div>${pessoa?.crm ? `<div class="text-[13px] text-grafite/55">${esc(pessoa.crm)}/${esc(pessoa.uf_crm || '')}</div>` : ''}</div></div>
    ${p ? `<div class="mt-3 border-t border-linha pt-3">${miniPlantao(p)}</div>` : ''}</div>`;
}
function vTrocar() {
  const p = plantao(S.params.id);
  if (!p) return topo('Passar ou trocar', { voltar: true }) + main(vazio('Plantão não encontrado.'));
  if (!S.troca || S.troca.plantao !== p.id) S.troca = { plantao: p.id, colega: null, contra: null, msg: '' };
  const T = S.troca; const col = perfil(T.colega);
  let bloco;
  if (!col) bloco = `<button onclick="escolherColega()" class="btn btn-p w-full py-3.5 text-[16px]">${ic('search')} Buscar colega</button>`;
  else {
    const dele = S.plantoes.filter(x => x.medico_id === col.id && D(x.inicio) > new Date() && !solAtiva(x.id) && apto(S.eu, x.setor_id)).sort(porInicio).slice(0, 20);
    const opcao = (v, titulo, sub) => `<button onclick="S.troca.contra=${v ? `'${v}'` : 'null'};render()" class="flex w-full items-start gap-3 rounded-xl p-3 text-left ring-1 ${T.contra === v ? 'bg-vinho-50 ring-vinho-400' : 'ring-linha hover:bg-vinho-50/40'}">
      <span class="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full ring-2 ${T.contra === v ? 'bg-vinho-600 ring-vinho-600 text-white' : 'ring-grafite/25'}">${T.contra === v ? ic('check', 'w-3 h-3') : ''}</span><span><span class="block text-[15px] font-semibold">${titulo}</span>${sub}</span></button>`;
    bloco = `<div class="card p-4"><div class="flex items-center gap-3">${avatar(col)}<div class="min-w-0 flex-1"><div class="text-[12px] text-grafite/55">Colega</div><div class="truncate text-[16px] font-bold text-vinho-700">${esc(col.nome || nomeCurto(col))}</div></div><button class="btn btn-s !px-3 !py-1.5 text-[13px]" onclick="escolherColega()">Alterar</button></div>
      <p class="mb-2 mt-4 text-[14px] font-bold text-grafite/70">O que você quer propor?</p>
      <div class="space-y-2">${opcao(null, `Só passar meu plantão para ${esc(nomeCurto(col))}`, '<span class="text-[13px] text-grafite/60">Você não recebe nenhum plantão em troca.</span>')}
      ${dele.map(x => opcao(x.id, `Trocar pelo plantão de ${dataCurta(D(x.inicio))}`, `<span class="text-[13px] text-grafite/60">${faixa(x)}, ${fmtH(horas(x))}, ${esc(setor(x.setor_id)?.nome || '')}</span>`)).join('')}</div>
      ${!dele.length ? '<p class="mt-2 text-[13px] text-grafite/55">Este colega não tem plantões futuros livres para troca no período carregado.</p>' : ''}
      <label class="lbl">Mensagem (opcional)</label><textarea class="inp" rows="2" oninput="S.troca.msg=this.value" placeholder="Ex.: tenho um compromisso nesse dia">${esc(T.msg)}</textarea></div>`;
  }
  return topo('Passar ou trocar', { voltar: true }) + main(`
    ${blocoPessoa(p, S.eu, 'Seu plantão')}
    <div class="my-2 flex justify-center"><span class="grid h-9 w-9 place-items-center rounded-full bg-ambar text-white">${ic('swap', 'w-4 h-4')}</span></div>
    ${bloco}
    ${col ? `<div class="mt-4 grid grid-cols-2 gap-2"><button class="btn btn-s py-3" onclick="history.back()">${ic('x')} Não</button><button class="btn btn-p py-3" onclick="enviarTroca()">${ic('check')} ${T.contra ? 'Propor troca' : 'Propor passagem'}</button></div>
      <p class="mt-2 text-center text-[13px] text-grafite/55">${esc(nomeCurto(col))} precisa aceitar.${setor(p.setor_id)?.exige_aprovacao ? ' Depois, a coordenação aprova.' : ''} Você pode cancelar enquanto não houver resposta.</p>` : ''}`);
}

function vDividir() {
  const p = plantao(S.params.id);
  if (!p) return topo('Dividir plantão', { voltar: true }) + main(vazio('Plantão não encontrado.'));
  const total = horas(p);
  if (!S.divisao || S.divisao.id !== p.id) S.divisao = { id: p.id, h: Math.floor(total / 2) };
  const [a, b] = textoDivisao(p, S.divisao.h);
  return topo('Dividir plantão', { voltar: true }) + main(`
    ${blocoPessoa(p, perfil(p.medico_id), 'Plantão que será dividido')}
    <div class="card mt-3 p-4">
      <p class="text-[15px] text-grafite/75">Arraste para escolher onde o plantão será cortado. Surgem 2 plantões independentes: depois você pode anunciar, passar ou trocar só uma parte.</p>
      <input type="range" min="1" max="${Math.floor(total) - 1}" step="1" value="${S.divisao.h}" oninput="moverDivisao(this.value)" class="mt-5 w-full" aria-label="Ponto de divisão">
      <div class="mt-4 grid grid-cols-2 gap-2">
        <div class="rounded-xl bg-vinho-50 p-3"><div class="text-[12px] font-bold text-vinho-700">Parte 1</div><div id="div-a" class="tnum mt-1 text-[15px] font-semibold">${a}</div></div>
        <div class="rounded-xl bg-ameixa/10 p-3"><div class="text-[12px] font-bold text-ameixa">Parte 2</div><div id="div-b" class="tnum mt-1 text-[15px] font-semibold">${b}</div></div>
      </div></div>
    <button class="btn btn-p mt-4 w-full py-3.5 text-[16px]" onclick="confirmarDivisao()">${ic('scissors')} Dividir em 2 plantões</button>`);
}
function textoDivisao(p, h) {
  const ponto = new Date(D(p.inicio).getTime() + h * 36e5); const total = horas(p);
  const f = d => (ymd(d) !== ymd(D(p.inicio)) ? `${DIAS[d.getDay()]} ` : '') + hm(d);
  return [`${hm(D(p.inicio))} às ${f(ponto)} (${fmtH(h)})`, `${f(ponto)} às ${f(D(p.fim))} (${fmtH(total - h)})`];
}

function vAnuncios() {
  const disp = anunciosDisponiveis();
  const outros = S.sols.filter(s => s.tipo === 'anuncio' && s.status === 'pendente' && s.solicitante_id !== S.eu.id && !expirada(s) && !disp.includes(s));
  const meus = S.sols.filter(s => s.tipo === 'anuncio' && ativa(s) && !expirada(s) && (s.solicitante_id === S.eu.id || souCoord()));
  const tab = S.anTab;
  let corpo;
  if (tab === 'disponiveis') corpo = disp.length || outros.length ? `<div class="space-y-3">${disp.map(s => cardAnuncio(s, false)).join('')}${outros.map(s => cardAnuncio(s, false)).join('')}</div>`
    : vazio('Nenhum plantão anunciado agora. Quando um colega anunciar, ele aparece aqui.');
  else corpo = meus.length ? `<div class="space-y-3">${meus.map(s => cardAnuncio(s, true)).join('')}</div>`
    : vazio('Você não tem anúncios abertos. Para anunciar, abra um plantão seu na Agenda e toque em Anunciar plantão.', `<button class="btn btn-s" onclick="S.agendaModo='minha';irRaiz('agenda')">${ic('calendar')} Abrir minha agenda</button>`);
  return topo('Anúncios') + main(abas([['disponiveis', 'Disponíveis', disp.length], ['meus', souCoord() ? 'Gerenciar anúncios' : 'Meus anúncios', meus.length]], tab, 'mudarAnTab') + corpo);
}
function cardAnuncio(s, gerenciar) {
  const p = plantao(s.plantao_id); if (!p) return '';
  const anunc = perfil(s.solicitante_id); const dono = perfil(p.medico_id);
  const cs = S.cands.filter(c => c.solicitacao_id === s.id && ['ativa', 'escolhida'].includes(c.status));
  const minha = cs.find(c => c.medico_id === S.eu.id && c.status === 'ativa'); const podeIr = apto(S.eu, p.setor_id);
  let rodape = '';
  if (gerenciar) {
    if (s.status === 'aguardando_coordenador') rodape = `<p class="text-[14px]">Escolhido: <b>${esc(nomeCurto(perfil(s.destinatario_id)))}</b>. ${statusTag(s.status)}</p>`;
    else rodape = cs.length ? `<p class="mb-2 text-[13px] font-bold text-grafite/60">Candidatos</p><div class="space-y-2">${cs.map(c => { const m = perfil(c.medico_id); return `<div class="flex items-center gap-3">${avatar(m, 'w-9 h-9 text-[13px]')}<div class="min-w-0 flex-1"><div class="truncate text-[15px] font-semibold">${esc(nomeCurto(m))}</div><div class="text-[12px] text-grafite/55">${relativo(c.criado_em)}</div></div><button class="btn btn-p !px-3 !py-1.5 text-[14px]" onclick="escolher('${s.id}','${c.medico_id}')">Escolher</button></div>`; }).join('')}</div>`
      : '<p class="text-[14px] text-grafite/60">Ainda sem candidatos. Você será avisado quando alguém se candidatar.</p>';
    rodape += `<button class="btn btn-g mt-3 w-full" onclick="cancelarPedido('${s.id}')">Cancelar anúncio</button>`;
  } else if (minha) rodape = `<div class="flex items-center justify-between gap-2"><span class="text-[14px] font-semibold text-emerald-700">Você se candidatou. Aguarde a escolha.</span><button class="btn btn-g !px-3 !py-1.5 text-[14px]" onclick="candidatar('${s.id}',false)">Desistir</button></div>`;
  else rodape = podeIr ? `<button class="btn btn-p w-full" onclick="candidatar('${s.id}',true)">${ic('check')} Quero assumir</button>` : '<p class="text-[14px] text-grafite/55">Você não está habilitado neste setor.</p>';
  return `<div class="card overflow-hidden"><div class="flex items-center gap-3 border-b border-linha p-4">
      <div class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-ambar text-white">${ic('megaphone')}</div>
      <div class="min-w-0 flex-1"><div class="truncate text-[15px] font-bold">${dono ? `Anúncio de ${esc(nomeCurto(dono))}` : `Vaga anunciada por ${esc(nomeCurto(anunc))}`}</div><div class="text-[13px] text-grafite/55">${relativo(s.criado_em)} · ${plural(cs.length, 'candidato', 'candidatos')}</div></div></div>
    <div class="p-4">${miniPlantao(p)}${s.mensagem ? `<p class="mt-2 rounded-xl bg-papel p-3 text-[14px] text-grafite/75">“${esc(s.mensagem)}”</p>` : ''}<div class="mt-3">${rodape}</div></div></div>`;

function vPendencias() {

function calcularRelatorio() {
  const R = S.rel; const { hist, pls } = R.dados;
  const movs = hist.filter(h => !R.setor || h.setor_id === R.setor);
  const cont = { troca: new Set(movs.filter(h => h.tipo === 'troca').map(h => h.solicitacao_id || h.id)).size, passagem: movs.filter(h => h.tipo === 'passagem').length, anuncio: movs.filter(h => h.tipo === 'anuncio').length, divisao: movs.filter(h => h.tipo === 'divisao').length };
  const mapa = {}; const reg = id => (mapa[id || 'vago'] = mapa[id || 'vago'] || { id: id || 'vago', n: 0, h: 0, v: 0, ced: 0, rec: 0 });
  pls.filter(p => !R.setor || p.setor_id === R.setor).forEach(p => { const o = reg(p.medico_id); o.n++; o.h += horas(p); o.v += Number(p.valor || 0); });
  movs.filter(h => ['troca', 'passagem', 'anuncio'].includes(h.tipo)).forEach(h => { if (h.de_medico_id) reg(h.de_medico_id).ced++; if (h.para_medico_id) reg(h.para_medico_id).rec++; });
  let fech = Object.values(mapa).map(o => ({ ...o, p: perfil(o.id), nome: o.id === 'vago' ? 'Plantões vagos' : nomeCurto(perfil(o.id)) }));
  if (!souCoord()) fech = fech.filter(f => f.id === S.eu.id);
  fech.sort((a, b) => (a.id === 'vago') - (b.id === 'vago') || b.h - a.h);
  return { movs, fech, cont };
}
async function carregarRelatorio() {
  S.rel.carregando = true; if (S.view === 'relatorios') render();
  try { const de = S.rel.mes, ate = addMeses(S.rel.mes, 1); const [hist, pls] = await Promise.all([api.historico(de, ate), api.plantoesPeriodo(de, ate)]); S.rel.dados = { hist, pls }; }

}
function mudarMesRel(n) { S.rel.mes = addMeses(S.rel.mes, n); carregarRelatorio(); }

// =====================================================================
function carga(on) { $('#carga').style.opacity = on ? '1' : '0'; }
function toast(msg, tipo = 'ok') {
  const el = document.createElement('div');
  el.className = `sobe pointer-events-auto max-w-md rounded-2xl px-4 py-3 text-[15px] font-semibold shadow-lg ${tipo === 'erro' ? 'bg-red-700 text-white' : 'bg-grafite text-white'}`;
  el.setAttribute('role', 'status'); el.textContent = msg; $('#toast').appendChild(el);
  setTimeout(() => el.remove(), tipo === 'erro' ? 6500 : 3800);
}
async function executar(fn, msgOk) {
  if (S.ocupado) return FALHA;
  S.ocupado = true; carga(true);
  try { const r = await fn(); if (msgOk) toast(msgOk); await recarregar(); return r; }
  catch (e) { toast(traduz(e).message, 'erro'); return FALHA; }
  finally { S.ocupado = false; carga(false); }
}
function janela() {
  const hoje = inicioMes(new Date()); const a = S.mes < hoje ? S.mes : hoje; const b = S.mes > hoje ? S.mes : hoje;
  return [addMeses(a, -1), addMeses(b, 3)];
}
async function carregarDados() {
  const [de, ate] = janela();
  const d = await api.carregar(de, ate);
  Object.assign(S, d); S.janela = [de, ate];
  S.eu = S.perfis.find(p => p.id === S.eu.id) || S.eu;
}
async function recarregar() { await carregarDados(); const y = window.scrollY; render(); window.scrollTo(0, y); if (S.view === 'relatorios') carregarRelatorio(); }
let tRecarga = null;
function agendarRecarga() {
  clearTimeout(tRecarga);
  tRecarga = setTimeout(async () => {
    if (!S.eu || ['login', 'primeiro', 'setup', 'carregando'].includes(S.view)) return;
    const antes = contarRecebidas();
    try { await carregarDados(); } catch (e) { return; }
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if (S.view === 'relatorios') carregarRelatorio();
    if (contarRecebidas() > antes) toast('Você recebeu um novo pedido. Veja em Pendências.');
  }, 700);
}

function anunciar(id) {
  confirmar({ titulo: 'Anunciar este plantão?', texto: 'Colegas habilitados no setor poderão se candidatar. O plantão continua seu até você escolher quem assume.', ok: 'Anunciar', campo: 'Mensagem para os colegas (opcional)' },
    v => executar(() => api.rpc('criar_solicitacao', { p_tipo: 'anuncio', p_plantao: id, p_mensagem: v }), 'Plantão anunciado.'));
}
async function enviarTroca() {
  const T = S.troca; const col = perfil(T.colega);
  const r = await executar(() => api.rpc('criar_solicitacao', { p_tipo: T.contra ? 'troca' : 'passagem', p_plantao: T.plantao, p_destinatario: T.colega, p_plantao_contra: T.contra, p_mensagem: T.msg }), `Proposta enviada para ${nomeCurto(col)}.`);
  if (r !== FALHA) { S.troca = null; history.back(); }
}
function cancelarPedido(id) { confirmar({ titulo: 'Cancelar este pedido?', ok: 'Cancelar pedido', perigo: true }, () => executar(() => api.rpc('cancelar_solicitacao', { p_solicitacao: id }), 'Pedido cancelado.')); }
async function responder(id, aceitar) {
  if (!aceitar) return confirmar({ titulo: 'Recusar este pedido?', ok: 'Recusar', perigo: true, campo: 'Motivo (opcional)' },
    v => executar(() => api.rpc('responder_solicitacao', { p_solicitacao: id, p_aceitar: false, p_motivo: v }), 'Pedido recusado.'));
  const r = await executar(() => api.rpc('responder_solicitacao', { p_solicitacao: id, p_aceitar: true }));
  if (r !== FALHA) toast(r === 'aguardando_coordenador' ? 'Aceito. Agora falta a aprovação da coordenação.' : 'Pronto! A escala já foi atualizada.');
}
async function aprovar(id, ok) {
  if (!ok) return confirmar({ titulo: 'Recusar este pedido?', ok: 'Recusar', perigo: true, campo: 'Motivo (aparece para os médicos)' },
    v => executar(() => api.rpc('aprovar_solicitacao', { p_solicitacao: id, p_aprovar: false, p_motivo: v }), 'Pedido recusado.'));
  await executar(() => api.rpc('aprovar_solicitacao', { p_solicitacao: id, p_aprovar: true }), 'Aprovado. A escala foi atualizada.');
}
function candidatar(id, entrar) { executar(() => api.rpc('candidatar', { p_solicitacao: id, p_entrar: entrar }), entrar ? 'Candidatura enviada. Aguarde a escolha.' : 'Candidatura retirada.'); }
function escolher(sid, mid) {
  confirmar({ titulo: `Passar o plantão para ${esc(nomeCurto(perfil(mid)))}?`, texto: 'Os outros candidatos serão avisados de que não foram escolhidos.', ok: 'Escolher' }, async () => {
    const r = await executar(() => api.rpc('escolher_candidato', { p_solicitacao: sid, p_medico: mid }));
    if (r !== FALHA) toast(r === 'aguardando_coordenador' ? 'Candidato escolhido. Falta a aprovação da coordenação.' : 'Pronto! O plantão foi passado.');
  });
}
function presenca(id, acao) { executar(() => api.rpc('registrar_presenca', { p_plantao: id, p_acao: acao }), acao === 'entrada' ? 'Entrada registrada. Bom plantão!' : 'Saída registrada.'); }
function moverDivisao(v) {
  S.divisao.h = Number(v); const [a, b] = textoDivisao(plantao(S.divisao.id), S.divisao.h);
  $('#div-a').textContent = a; $('#div-b').textContent = b;
}
async function confirmarDivisao() {
  const p = plantao(S.divisao.id); const ponto = new Date(D(p.inicio).getTime() + S.divisao.h * 36e5);
  const novo = await executar(() => api.rpc('dividir_plantao', { p_plantao: p.id, p_ponto: ponto.toISOString() }), 'Plantão dividido. Esta é a segunda parte: agora você pode anunciar ou passar.');
  if (novo !== FALHA) { S.divisao = null; substituir('plantao', { id: novo }); }
}
async function salvarPrimeiro() {
  const v = id => ($(id)?.value || '').trim();

// ---------- Excel: importar escala ----------
function parseData(v) {
  if (v instanceof Date) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
  if (typeof v === 'number') { const o = XLSX.SSF.parse_date_code(v); return o ? { y: o.y, m: o.m, d: o.d } : null; }
  const s = String(v || '').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return { y: +m[1], m: +m[2], d: +m[3] };
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return { y: m[3].length === 2 ? 2000 + +m[3] : +m[3], m: +m[2], d: +m[1] };
  return null;
}
function parseHora(v) {
  if (v === '' || v == null) return null;
  if (typeof v === 'number') { const min = Math.round((v % 1) * 1440); return { h: Math.floor(min / 60) % 24, mi: min % 60 }; }
  const m = String(v).trim().match(/^(\d{1,2})\s*[:hH]\s*(\d{2})?/); return m ? { h: +m[1] % 24, mi: +(m[2] || 0) } : null;
}
async function lerImportacao(arquivo) {
  if (!arquivo) return;
  if (!window.XLSX) return toast('A biblioteca do Excel não carregou. Verifique a internet.', 'erro');
  carga(true);
  try {
    const wb = XLSX.read(await arquivo.arrayBuffer(), { type: 'array' });
    const aba = wb.SheetNames.find(n => norm(n) === 'importar') || wb.SheetNames[0];
    const brutas = XLSX.utils.sheet_to_json(wb.Sheets[aba], { raw: true, defval: '' }).map(r => {
      const o = {}; Object.entries(r).forEach(([k, v]) => { o[norm(k).replace(/[\s-]+/g, '_')] = v; }); return o;
    });
    S.imp = { nome: `${arquivo.name} (aba ${aba})`, brutas, linhas: [], novosSetores: [] };
    await prepararImportacao();
  } catch (e) { toast('Não consegui ler o arquivo: ' + traduz(e).message, 'erro'); }
  finally { carga(false); }
}
async function prepararImportacao() {
  const I = S.imp; const padrao = setor(S.impSetor) || S.setores[0];
  const pega = (r, ...ks) => { for (const k of ks) if (r[k] !== undefined && r[k] !== '') return r[k]; return ''; };
  const novos = new Set();
  const linhas = I.brutas.filter(r => Object.values(r).some(v => String(v).trim() !== '')).map(r => {
    const tipo = String(pega(r, 'turno', 'tipo') || 'P24').trim().toUpperCase();
    const data = parseData(pega(r, 'data', 'dia'));
    const setorNome = String(pega(r, 'setor') || padrao?.nome || '').trim();
    const nomeOriginal = String(pega(r, 'nome_na_escala', 'medico', 'nome', 'profissional')).trim();
    const l = { setorNome, nomeOriginal, tipo, obs: String(pega(r, 'observacao', 'obs')).trim() || null };
    if (!data) return { ...l, situacao: 'erro', erro: 'Data inválida' };
    const hi = parseHora(pega(r, 'inicio', 'hora_inicio', 'entrada')) || parseHora(TIPOS[tipo]?.ini || '07:00');
    l.inicio = new Date(data.y, data.m - 1, data.d, hi.h, hi.mi);
    const hs = parseFloat(String(pega(r, 'horas', 'duracao')).replace(',', '.'));
    const hf = parseHora(pega(r, 'fim', 'hora_fim', 'saida'));
    if (hs > 0) l.fim = new Date(l.inicio.getTime() + hs * 36e5);
    else if (hf) { l.fim = new Date(data.y, data.m - 1, data.d, hf.h, hf.mi); if (l.fim <= l.inicio) l.fim = addDias(l.fim, 1); }
    else l.fim = new Date(l.inicio.getTime() + (TIPOS[tipo]?.h || 24) * 36e5);
    const v = pega(r, 'valor', 'valor_r$'); l.valor = v === '' ? null : Number(String(v).replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) || null;
    const st = S.setores.find(s => norm(s.nome) === norm(setorNome));
    if (!setorNome) return { ...l, situacao: 'erro', erro: 'Sem setor' };
    if (!st) novos.add(setorNome);
    l.setorId = st?.id || null;
    l.medico = nomeOriginal ? S.perfis.find(m => norm(m.nome_na_escala) === norm(nomeOriginal)) || S.perfis.find(m => norm(m.nome) === norm(nomeOriginal)) : null;
    l.situacao = l.medico ? 'ok' : 'vago';
    return l;
  });
  const validas = linhas.filter(l => l.inicio);
  if (validas.length) {
    const min = new Date(Math.min(...validas.map(l => l.inicio))), max = new Date(Math.max(...validas.map(l => l.inicio)));
    const existentes = await api.plantoesPeriodo(addDias(inicioDia(min), -1), addDias(inicioDia(max), 2));
    const vistos = new Set(existentes.map(p => `${p.setor_id}|${D(p.inicio).getTime()}`));
    validas.forEach(l => { if (l.situacao === 'erro' || !l.setorId) return; const k = `${l.setorId}|${l.inicio.getTime()}`; if (vistos.has(k)) l.situacao = 'duplicado'; else vistos.add(k); });
  }
  I.linhas = linhas; I.novosSetores = [...novos]; render();
}
async function confirmarImportacao() {
  const I = S.imp;
  const r = await executar(async () => {
    const mapa = {};
    for (const nome of I.novosSetores) { const s = await api.salvar('setores', { hospital_id: S.eu.hospital_id, nome, cor: '#971232', exige_aprovacao: false, permite_divisao: true, ativo: true }); mapa[norm(nome)] = s.id; }
    const rows = I.linhas.filter(l => l.situacao === 'ok' || l.situacao === 'vago').map(l => ({
      hospital_id: S.eu.hospital_id, setor_id: l.setorId || mapa[norm(l.setorNome)], medico_id: l.medico?.id || null,
      inicio: l.inicio.toISOString(), fim: l.fim.toISOString(), tipo: TIPOS[l.tipo] ? l.tipo : (l.tipo || 'P24').slice(0, 12), valor: l.valor,
      status: l.medico ? 'designado' : 'vago', observacao: l.obs }));
    await api.inserirVarios('plantoes', rows);
    return rows.length;
  });
  if (r !== FALHA) { toast(`${plural(r, 'plantão importado', 'plantões importados')}.`); S.imp = null; render(); }
}
function baixarModelo() {
  if (!window.XLSX) return toast('A biblioteca do Excel não carregou. Verifique a internet.', 'erro');
  const m = addMeses(new Date(), 1); const d = n => ymd(new Date(m.getFullYear(), m.getMonth(), n));

    [S.hospital?.nome || NOME_HOSPITAL, st, d(2), '07:00', '07:00', 24, 'P24', ex(2, 1), '', ''],
    [S.hospital?.nome || NOME_HOSPITAL, st, d(3), '07:00', '19:00', 12, 'D12', ex(3, 2), '', 'Exemplo de 12h diurno'],
    [S.hospital?.nome || NOME_HOSPITAL, st, d(3), '19:00', '07:00', 12, 'N12', '', '', 'Sem nome = plantão vago'],

<script type="text/plain" id="sql-instalacao">-- =====================================================================
--  GESTÃO DE PLANTÃO  |  Script de instalação do banco (Supabase)
--  Como usar: Supabase > SQL Editor > New query > cole TUDO > Run
--  Pode rodar de novo quando houver atualização: ele não apaga dados.

-- ---------- 1. TABELAS (todas com hospital_id: pronto para vários hospitais) ----------
create table if not exists public.hospitais (
  id uuid primary key default gen_random_uuid(),
  nome text not null,
  cidade text,
  criado_em timestamptz not null default now()
);

create table if not exists public.setores (
  id uuid primary key default gen_random_uuid(),
  hospital_id uuid not null references public.hospitais(id) on delete cascade,
  nome text not null,
  cor text not null default '#971232',
  exige_aprovacao boolean not null default false,   -- troca precisa do OK do coordenador?
  permite_divisao boolean not null default true,
  ativo boolean not null default true,
  criado_em timestamptz not null default now(),
  unique (hospital_id, nome)
);

create table if not exists public.perfis (           -- 1 linha por usuário (médico ou coordenador)
  id uuid primary key references auth.users(id) on delete cascade,
  hospital_id uuid not null references public.hospitais(id),
  email text,
  nome text,
  nome_na_escala text,                               -- como o nome aparece no Excel (liga a planilha ao médico)
  crm text,
  uf_crm text,
  especialidade text,
  telefone text,
  papel text not null default 'medico' check (papel in ('medico','coordenador')),
  setores uuid[] not null default '{}',              -- setores em que o médico está habilitado
  ativo boolean not null default true,
  cadastro_completo boolean not null default false,
  aceite_lgpd_em timestamptz,
  criado_em timestamptz not null default now()
);
create unique index if not exists perfis_nome_escala_unico
  on public.perfis (hospital_id, lower(nome_na_escala)) where coalesce(nome_na_escala, '') <> '';

create table if not exists public.plantoes (
  id uuid primary key default gen_random_uuid(),
  hospital_id uuid not null references public.hospitais(id) on delete cascade,
  setor_id uuid not null references public.setores(id) on delete cascade,
  medico_id uuid references public.perfis(id) on delete set null,   -- vazio = plantão vago
  inicio timestamptz not null,
  fim timestamptz not null,
  tipo text not null default 'P24',
  valor numeric(10,2),
  status text not null default 'designado' check (status in ('designado','anunciado','vago')),
  origem_id uuid references public.plantoes(id) on delete set null, -- preenchido quando nasce de uma divisão
  checkin_em timestamptz,
  checkout_em timestamptz,
  observacao text,
  criado_em timestamptz not null default now(),
  constraint plantao_horario_valido check (fim > inicio)
);
create index if not exists plantoes_hospital_inicio on public.plantoes (hospital_id, inicio);
create index if not exists plantoes_medico_inicio on public.plantoes (medico_id, inicio);

create table if not exists public.solicitacoes (      -- trocas, passagens e anúncios
  id uuid primary key default gen_random_uuid(),
  hospital_id uuid not null references public.hospitais(id) on delete cascade,
  tipo text not null check (tipo in ('troca','passagem','anuncio')),
  plantao_id uuid not null references public.plantoes(id) on delete cascade,
  plantao_contra_id uuid references public.plantoes(id) on delete cascade,  -- na troca: o plantão do colega
  solicitante_id uuid not null references public.perfis(id) on delete cascade,
  destinatario_id uuid references public.perfis(id) on delete set null,     -- colega ou candidato escolhido
  status text not null default 'pendente'
    check (status in ('pendente','aguardando_coordenador','concluida','recusada','cancelada')),
  mensagem text,
  motivo text,
  decidido_por uuid references public.perfis(id) on delete set null,
  aceito_em timestamptz,
  concluido_em timestamptz,
  criado_em timestamptz not null default now()
);
create unique index if not exists solicitacao_ativa_plantao on public.solicitacoes (plantao_id)
  where status in ('pendente','aguardando_coordenador');
create unique index if not exists solicitacao_ativa_contra on public.solicitacoes (plantao_contra_id)
  where plantao_contra_id is not null and status in ('pendente','aguardando_coordenador');

create table if not exists public.candidaturas (      -- quem quer assumir um plantão anunciado
  id uuid primary key default gen_random_uuid(),
  hospital_id uuid not null references public.hospitais(id) on delete cascade,
  solicitacao_id uuid not null references public.solicitacoes(id) on delete cascade,
  medico_id uuid not null references public.perfis(id) on delete cascade,
  status text not null default 'ativa' check (status in ('ativa','escolhida','nao_escolhida','cancelada')),
  criado_em timestamptz not null default now(),
  unique (solicitacao_id, medico_id)
);

create table if not exists public.historico (         -- base do relatório de trocas e do fechamento
  id uuid primary key default gen_random_uuid(),
  hospital_id uuid not null references public.hospitais(id) on delete cascade,
  tipo text not null,                                 -- troca, passagem, anuncio, divisao, ajuste
  plantao_id uuid references public.plantoes(id) on delete set null,
  solicitacao_id uuid references public.solicitacoes(id) on delete set null,
  de_medico_id uuid references public.perfis(id) on delete set null,
  para_medico_id uuid references public.perfis(id) on delete set null,
  setor_id uuid references public.setores(id) on delete set null,
  inicio timestamptz,
  fim timestamptz,
  detalhes text,
  feito_por uuid references public.perfis(id) on delete set null,
  criado_em timestamptz not null default now()
);
create index if not exists historico_hospital_inicio on public.historico (hospital_id, inicio);

-- ---------- 3. FUNÇÕES DE APOIO ----------
create or replace function public.meu_hospital() returns uuid
language sql stable security definer set search_path = public as $$
  select hospital_id from perfis where id = auth.uid() and ativo;
$$;

create or replace function public.eh_coordenador() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select papel = 'coordenador' from perfis where id = auth.uid() and ativo), false);
$$;

create or replace function public._eu() returns public.perfis
language plpgsql stable security definer set search_path = public as $$
declare p perfis;
begin
  select * into p from perfis where id = auth.uid() and ativo;
  if p.id is null then raise exception 'Seu acesso não está ativo. Fale com a coordenação.'; end if;
  return p;
end $$;

create or replace function public._apto(p_medico uuid, p_setor uuid) returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from perfis where id = p_medico and ativo and p_setor = any(setores));
$$;

create or replace function public._conflito(p_medico uuid, p_inicio timestamptz, p_fim timestamptz, p_ignorar uuid[] default '{}')
returns boolean language sql stable security definer set search_path = public as $$
  select exists (select 1 from plantoes
    where medico_id = p_medico and id <> all(array_remove(coalesce(p_ignorar, '{}'), null))
      and inicio < p_fim and fim > p_inicio);
$$;

create or replace function public._exige_aprovacao(p_plantao uuid) returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select s.exige_aprovacao from plantoes p join setores s on s.id = p.setor_id where p.id = p_plantao), false);
$$;

-- ---------- 4. PERFIL AUTOMÁTICO PARA CADA USUÁRIO CRIADO ----------
create or replace function public.novo_usuario() returns trigger
language plpgsql security definer set search_path = public as $$
declare h uuid; primeiro boolean;
begin
  select id into h from hospitais order by criado_em limit 1;
  select not exists (select 1 from perfis) into primeiro;
  insert into perfis (id, hospital_id, email, papel)
  values (new.id, h, new.email, case when primeiro then 'coordenador' else 'medico' end)
  on conflict (id) do nothing;
  return new;
end $$;

drop trigger if exists ao_criar_usuario on auth.users;
create trigger ao_criar_usuario after insert on auth.users
  for each row execute function public.novo_usuario();

-- usuários criados antes deste script também ganham perfil
insert into public.perfis (id, hospital_id, email)
select u.id, (select id from public.hospitais order by criado_em limit 1), u.email
from auth.users u on conflict (id) do nothing;

-- se ainda não houver coordenador, o usuário mais antigo vira coordenador
update public.perfis set papel = 'coordenador'
where id = (select id from public.perfis order by criado_em limit 1)
  and not exists (select 1 from public.perfis where papel = 'coordenador');
